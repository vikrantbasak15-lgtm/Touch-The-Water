<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pond</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;800&display=swap">
<style>
:root{--bg:#0a2236;--ink:#f2f7f5;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Syne',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
h1{position:fixed;left:6vw;bottom:calc(8vh + env(safe-area-inset-bottom,0px));margin:0;font-weight:800;font-size:clamp(2.6rem,9vw,7rem);line-height:.95;letter-spacing:-.03em;pointer-events:none;text-shadow:0 2px 28px rgba(0,20,40,.55)}
p{position:fixed;left:6vw;bottom:calc(3vh + env(safe-area-inset-bottom,0px));margin:0;font-weight:500;opacity:.8;pointer-events:none;text-shadow:0 1px 8px rgba(0,20,40,.7)}
#ui{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-size:.9rem}
#ui button{font:inherit;color:var(--ink);background:rgba(10,34,54,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.45em .95em;backdrop-filter:blur(10px);cursor:pointer}
#ui button[aria-pressed=true],#ui #bGear[aria-expanded=true]{background:rgba(95,214,196,.4)}
#panel{width:min(86vw,300px);max-height:65vh;overflow:auto;padding:14px 16px;border-radius:18px;background:rgba(10,34,54,.62);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px)}
#panel[hidden]{display:none}
#panel h2{margin:0 0 8px;font-size:1rem;font-weight:800;letter-spacing:.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.1)}
.row input{width:120px}
</style>
</head>
<body>
<canvas id="c" aria-label="Photorealistic pond with ripples"></canvas>
<h1>Touch<br>the water.</h1>
<p>Click, tap or drag.</p>
<div id="ui"><div id="panel" hidden>
<h2>Settings</h2>
<div class="row"><span>Quality</span><button id="bQual">Auto</button></div>
<div class="row"><span>Rain</span><button id="bRain" aria-pressed="false">Off</button></div>
<div class="row"><span>Time of day</span><button id="bTime">Day</button></div>
<div class="row"><span>Stone skipping</span><button id="bStone" aria-pressed="false">Off</button></div>
<div class="row"><span>Sound</span><button id="bSnd">On</button></div>
<div class="row"><span>Koi fish</span><button id="bFish" aria-pressed="true">On</button></div>
<div class="row"><span>Frogs &amp; dragonflies</span><button id="bCrit" aria-pressed="true">On</button></div>
<div class="row"><span>Wind</span><input id="wind" type="range" min="0" max="1" step=".05" value="0"></div>
<div class="row"><span>Wave strength</span><input id="waveK" type="range" min=".4" max="2" step=".1" value="1"></div>
<div class="row"><span>Calm the water</span><button id="bCalm">Calm</button></div>
</div><button id="bGear" aria-expanded="false">&#9881; Settings</button></div>
<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false});
if(!gl){document.body.insertAdjacentHTML('beforeend','<p style="top:40%;bottom:auto">This page needs WebGL.</p>')}
else{
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D uSim;uniform vec2 uRes;uniform float uTime;uniform vec4 uLeaf[4];uniform vec4 uFish[3];uniform vec4 uFrog;uniform vec4 uDfly[2];uniform vec3 uFly[12];uniform vec3 uSkyH,uSkyZ,uSunC;uniform float uFt,uWind,uExp,uNight,uLow;
vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453);}
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}
float fbm3(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vn(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
float fbm5(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
vec4 pebbles(vec2 p,out vec2 rc){
  vec2 i=floor(p),f=fract(p);float d1=8.,d2=8.;vec2 id=vec2(0.);vec2 best=vec2(0.);
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 g=vec2(float(x),float(y));vec2 r=g+h2(i+g)-f;float d=dot(r,r);
    if(d<d1){d2=d1;d1=d;id=i+g;best=r;}else if(d<d2){d2=d;}
  }
  rc=best;
  return vec4(sqrt(d1),sqrt(d2)-sqrt(d1),h2(id+7.3));
}
float caustic(vec2 uv,float t){
  vec2 p=mod(uv*6.28318,6.28318)-250.;vec2 i=p;float c=1.,k=.005;
  for(int n=0;n<4;n++){
    float tt=t*(1.-3.5/float(n+1));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/k),p.y/(cos(i.y+tt)/k)));
  }
  c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);
}
float leaf(vec2 pp,vec4 lf,out vec2 loc){
  vec2 d=pp-lf.xy;float ca=cos(lf.z),sa=sin(lf.z);
  vec2 r=vec2(ca*d.x+sa*d.y,-sa*d.x+ca*d.y);
  float u=r.x/.1,v=r.y/.06;
  v+=.18*u*u;
  loc=vec2(u,v);
  float w=pow(max(1.-u*u,0.),mix(.45,.9,smoothstep(-1.,1.,u)));
  return max(abs(v)-w,abs(u)-1.);
}
float fishD(vec2 pp,vec4 f,out vec2 loc){
  vec2 d=pp-f.xy;float ca=cos(f.z),sa=sin(f.z);
  vec2 r=vec2(ca*d.x+sa*d.y,-sa*d.x+ca*d.y);
  float u=r.x/.09,v=r.y/.03;
  float s=clamp((-u-.45)/.55,0.,1.);
  v-=sin(uFt*6.+f.w)*.35*s*s;
  loc=vec2(u,v);
  float bd=length(vec2((u-.28)/.72,v/.5))-1.;
  float td=max(abs(v)-(.15+.9*s),max(-u-1.,u+.45));
  return min(bd,td);
}
float ell(vec2 p,vec2 c,vec2 ab){return (length((p-c)/ab)-1.)*min(ab.x,ab.y)/.02;}
float frogD(vec2 pp,vec4 f,out vec2 loc){
  vec2 d=pp-f.xy;float ca=cos(f.z),sa=sin(f.z);
  vec2 r=vec2(ca*d.x+sa*d.y,-sa*d.x+ca*d.y)/f.w;
  loc=r;
  float b=min(ell(r,vec2(0.),vec2(.026,.017)),ell(r,vec2(.022,0.),vec2(.014,.013)));
  float h=min(ell(r,vec2(-.022,.019),vec2(.013,.0065)),ell(r,vec2(-.022,-.019),vec2(.013,.0065)));
  float fr=min(ell(r,vec2(.012,.018),vec2(.008,.005)),ell(r,vec2(.012,-.018),vec2(.008,.005)));
  return min(min(b,h),fr);
}
float dragon(vec2 r,float fl,out float wing){
  float body=ell(r,vec2(0.),vec2(.05,.0035));
  float head=ell(r,vec2(.052,0.),vec2(.0065,.0065));
  wing=min(min(ell(r,vec2(.014,.026*fl),vec2(.007,.027*fl)),ell(r,vec2(.014,-.026*fl),vec2(.007,.027*fl))),
           min(ell(r,vec2(-.002,.027*fl),vec2(.006,.025*fl)),ell(r,vec2(-.002,-.027*fl),vec2(.006,.025*fl))));
  return min(body,head);
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;vec2 p=uv*vec2(uRes.x/uRes.y,1.);float t=uTime*uWind;
  vec4 s=texture2D(uSim,uv);
  vec2 slope=-(s.rg-.5)*127.5*.03;
  // natural drifting surface chop from layered noise
  vec2 q=p*8.+vec2(t*.2,t*.12);
  float h0=fbm3(q),hx=fbm3(q+vec2(.05,0.)),hy=fbm3(q+vec2(0.,.05));
  slope+=(vec2(hx,hy)-h0)*(.7+uWind*1.2);
  for(int k=0;k<4;k++){
    vec2 lc0;float d0=leaf(p,uLeaf[k],lc0);
    vec2 dir=normalize(p-uLeaf[k].xy+1e-4);
    slope+=dir*smoothstep(0.,.05,d0)*exp(-max(d0,0.)*5.)*.05;
  }
  vec3 n=normalize(vec3(slope,1.));
  // water depth varies across the pond
  float depth=.55+.9*fbm3(p*1.3+3.);
  // pebble bed with bump lighting and wet sheen
  vec2 fp=(p+slope*.1*depth)*7.;
  vec2 rc;vec4 pb=pebbles(fp,rc);
  vec3 base=mix(vec3(.52,.45,.35),vec3(.80,.72,.56),pb.z);
  base=mix(base,vec3(.34,.40,.38),step(.68,pb.w)*.85);
  float dome=1.-smoothstep(0.,.62,pb.x);
  vec3 pn=normalize(vec3(-rc*1.5*dome,.75));
  vec3 Ls=normalize(vec3(-.3,.4,.85));
  float diff=max(dot(pn,Ls),0.);
  float wet=pow(max(dot(reflect(-Ls,pn),vec3(0.,0.,1.)),0.),30.)*.3;
  float ao=.2+.8*smoothstep(0.,.12,pb.y);
  vec3 col=(base*(.22+.95*diff)+wet)*ao;
  col+=(h2(fp*9.).x-.5)*.06;
  float asp=uRes.x/uRes.y;
  float sh=0.;
  for(int k=0;k<4;k++){vec2 lc;float d=leaf(p-vec2(.025,-.03)+slope*.05,uLeaf[k],lc);sh=max(sh,1.-smoothstep(-.5,.5,d));}
  col*=1.-.5*sh;
#ifdef FULL
  vec2 pf=p+slope*.1*depth;
  for(int k=0;k<3;k++){
    vec2 fl;float fd=fishD(pf,uFish[k],fl);
    vec2 fl2;float sd=fishD(pf-vec2(.02,-.03),uFish[k],fl2);
    col*=1.-.4*(1.-smoothstep(-.3,.6,sd));
    float fm=1.-smoothstep(-.04,.1,fd);
    float pat=smoothstep(.45,.55,fbm3(fl*vec2(2.,3.)+uFish[k].w*7.));
    vec3 fc=mix(vec3(.92,.9,.84),vec3(.95,.36,.08),pat);
    col=mix(col,fc*(.5+.4*clamp(1.-abs(fl.y),0.,1.)),fm*.92);
  }
#endif
  // caustics with slight colour dispersion
  vec2 cp=p*.4+slope*.6;float ct=t*.45;
  vec3 cs;
  if(uLow>.5){cs=vec3(caustic(cp,ct));}else{cs=vec3(caustic(cp+vec2(.004,0.),ct),caustic(cp,ct),caustic(cp-vec2(.004,0.),ct));}
  col+=cs*vec3(.8,.95,1.)*.9*exp(-depth*.5);
  // light absorption and scattering with depth
  col*=exp(-depth*vec3(.5,.18,.12));
  col=mix(col,vec3(.02,.22,.28),1.-exp(-depth*.7));
  // surface reflection: sky, clouds, haze and sun
  vec3 V=normalize(vec3(0.,-.8,.6));
  vec3 R=reflect(-V,n);
  vec3 sky=mix(uSkyH,uSkyZ,clamp(R.z*1.2,0.,1.));
  vec2 cu=R.xy/(R.z+.25)*1.3+vec2(t*.012,0.);
  float cf;if(uLow>.5){cf=fbm3(cu*2.);}else{cf=fbm5(cu*2.);}
  float cl=smoothstep(.45,.8,cf);
  vec3 ccol=mix(vec3(.72,.78,.88),vec3(1.),fbm3(cu*4.+5.));
  sky=mix(sky,ccol,cl*.9*smoothstep(.02,.35,R.z));
  vec3 L=normalize(vec3(-.35,.5,.55));
  float sd=max(dot(R,L),0.);
  vec3 sun=uSunC*(pow(sd,4000.)*160.+pow(sd,1000.)*25.+pow(sd,70.)*.5);
  float F=.03+.97*pow(1.-max(dot(n,V),0.),3.5);
  // light glowing through wave crests that tilt toward the sun
  col+=vec3(.04,.2,.17)*smoothstep(0.,.12,dot(slope,L.xy))*(.5+depth*.3);
  col=mix(col,sky,F)+sun;
  // floating leaves on the surface
  for(int k=0;k<4;k++){
    vec2 lc;float d=leaf(p+slope*.04,uLeaf[k],lc);
    float m=1.-smoothstep(-.03,.03,d);
    float ring=smoothstep(0.,.03,d)*(1.-smoothstep(.03,.1,d));
    col+=(sky*.18+.04)*ring;
    float kv=hs(vec2(float(k),9.9));
    float aut=smoothstep(.45,.9,fbm3(lc*3.+float(k)*5.)+kv*.5-.2);
    vec3 lcol=mix(vec3(.07,.2,.04),vec3(.3,.5,.1),fbm3(lc*18.));
    lcol=mix(lcol,vec3(.5,.3,.06),aut*.7);
    float ph=lc.x*9.-abs(lc.y)*5.;
    float vein=(1.-smoothstep(0.,.08,abs(fract(ph)-.5)))*smoothstep(0.,.12,abs(lc.y))*(1.-smoothstep(.6,1.,abs(lc.y)));
    float rib=(1.-smoothstep(0.,.05,abs(lc.y)))*(1.-smoothstep(.5,1.,lc.x));
    lcol=mix(lcol,lcol*1.6+.04,clamp(vein*.35+rib*.7,0.,1.));
    lcol=mix(lcol,lcol*1.3+.03,smoothstep(-.1,-.01,d)*.6);
    vec3 nl=normalize(vec3(-slope*2.+vec2(0.,lc.y*.25),1.));
    float lit=.45+.7*max(dot(nl,L),0.);
    vec3 trans=vec3(.22,.4,.06)*(.4+.6*fbm3(lc*8.))*.6;
    float spec=pow(max(dot(reflect(-V,nl),L),0.),40.)*.5;
    float beads=smoothstep(.78,.8,vn(lc*vec2(22.,30.)));
    vec3 lf=lcol*lit*1.4+trans+sky*.08+vec3(1.,.95,.85)*spec+vec3(.9,.95,1.)*beads*.25;
    col=mix(col,lf,m);
  }
#ifdef FULL
  if(uFrog.w>0.){
    vec2 fl;float fd=frogD(p+slope*.03,uFrog,fl);
    vec2 fl2;float fsd=frogD(p+slope*.03-vec2(.004,-.006)-(uFrog.w-1.)*vec2(.04,-.06),uFrog,fl2);
    col*=1.-.35*(1.-smoothstep(-.3,.4,fsd));
    float fm=1.-smoothstep(-.05,.08,fd);
    vec3 fg=mix(vec3(.16,.42,.10),vec3(.36,.60,.18),fbm3(fl*30.));
    fg=mix(fg,vec3(.08,.22,.06),smoothstep(.6,.66,fbm3(fl*60.+3.))*.8);
    fg*=.75+.5*smoothstep(-.03,.03,fl.x);
    col=mix(col,fg,fm);
    float ey=min(length(fl-vec2(.027,.008)),length(fl-vec2(.027,-.008)))/.02;
    col=mix(col,vec3(.85,.7,.15),(1.-smoothstep(.2,.26,ey))*fm);
    col=mix(col,vec3(.02),(1.-smoothstep(.08,.12,ey))*fm);
  }
  for(int k=0;k<2;k++){
    vec4 df=uDfly[k];
    if(df.w>.5){
      float hh=df.w-1.;
      float flap=.75+.25*sin(uFt*55.+float(k)*2.);
      float ca=cos(df.z),sa=sin(df.z);
      vec2 d0=p-df.xy;
      vec2 r0=vec2(ca*d0.x+sa*d0.y,-sa*d0.x+ca*d0.y);
      vec2 d1=d0-vec2(.012,-.02)*(.4+hh*1.6);
      vec2 r1=vec2(ca*d1.x+sa*d1.y,-sa*d1.x+ca*d1.y);
      float w1;float b1=dragon(r1,flap,w1);
      col*=1.-.22*(1.-smoothstep(-.2,.5,min(b1,w1)));
      float w0;float b0=dragon(r0,flap,w0);
      col=mix(col,vec3(.85,.93,1.),(1.-smoothstep(-.05,.15,w0))*.35);
      float bm=1.-smoothstep(-.05,.1,b0);
      col=mix(col,mix(vec3(.06,.30,.50),vec3(.15,.62,.70),smoothstep(-.02,.02,r0.y)),bm);
    }
  }
#endif
  col*=uExp;
  col*=mix(vec3(1.),normalize(uSunC+.001)*1.7,.3);
#ifdef FULL
  if(uNight>.01){
    for(int k=0;k<12;k++){
      vec3 fl=uFly[k];
      vec2 dd=p-fl.xy;vec2 dr=p-(fl.xy-vec2(0.,.07))-slope*.2;
      col+=vec3(1.,.85,.35)*fl.z*uNight*(.00025/(dot(dd,dd)+.00003)+.0001/(dot(dr,dr)+.00006));
    }
  }
#endif
  col*=1.-.55*dot(uv-.5,uv-.5);
  col=1.-exp(-col*1.5);
  col=pow(col,vec3(.92))+(hs(gl_FragCoord.xy+t)-.5)*.015;
  gl_FragColor=vec4(col,1.);
}
`;
function sh(type,src){const o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);return o}
let errLog='';
function build(defs){
  const p=gl.createProgram(),v=sh(gl.VERTEX_SHADER,VS),fr=sh(gl.FRAGMENT_SHADER,defs+FS);
  gl.attachShader(p,v);gl.attachShader(p,fr);gl.linkProgram(p);
  if(gl.getProgramParameter(p,gl.LINK_STATUS))return p;
  errLog=((gl.getShaderInfoLog(fr)||gl.getProgramInfoLog(p)||'unknown error')+'').slice(0,500);return null;
}
function note(msg){document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:8px;left:8px;right:8px;margin:0;z-index:9;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;text-shadow:0 1px 4px #000">'+msg.replace(/</g,'&lt;')+'</pre>')}
const pr=build('#define FULL\n')||build('');
if(!pr){note('Graphics error - please send this to Claude:\n'+errLog);throw new Error('shader failed')}
if(errLog)note('Simple mode (koi and fireflies off). Reason: '+errLog);
gl.useProgram(pr);
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();note('The graphics card reset. Reload the page.')});
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uLeaf=gl.getUniformLocation(pr,'uLeaf'),uRes=gl.getUniformLocation(pr,'uRes'),uTime=gl.getUniformLocation(pr,'uTime');
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);

const U=n=>gl.getUniformLocation(pr,n);
const uLow=U('uLow'),uFrog=U('uFrog'),uDfly=U('uDfly'),uFish=U('uFish'),uFly=U('uFly'),uSkyH=U('uSkyH'),uSkyZ=U('uSkyZ'),uSunC=U('uSunC'),uFt=U('uFt'),uWind=U('uWind'),uExp=U('uExp'),uNight=U('uNight');
let renderScale=Math.min(devicePixelRatio||1,1.5),slow=0;
let S=4;let gw,gh,A,B,bytes,D;
function init(){
  const d=renderScale;
  cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height);
  gl.uniform2f(uRes,cv.width,cv.height);
  gw=Math.ceil(innerWidth/S);gh=Math.ceil(innerHeight/S);
  A=new Float32Array(gw*gh);B=new Float32Array(gw*gh);bytes=new Uint8Array(gw*gh*4);
  // soft absorbing banks: waves fade near the edges instead of ringing forever
  D=new Float32Array(gw*gh);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const e=Math.min(x,y,gw-1-x,gh-1-y);D[y*gw+x]=.996*(e>=10?1:.95+.05*e/10)}
}
// Ricker-shaped splash: dip in the middle, raised ring around it, no net volume change
function bump(cx,cy,amp){
  cx=Math.round(cx);cy=Math.round(cy);
  for(let oy=-8;oy<=8;oy++)for(let ox=-8;ox<=8;ox++){
    const d=ox*ox+oy*oy;if(d>64)continue;
    const x=cx+ox,y=cy+oy;if(x<1||y<1||x>=gw-1||y>=gh-1)continue;
    const q=d/10;A[y*gw+x]+=amp*(1-2*q)*Math.exp(-q);
  }
}
function disturb(cx,cy,amp){pushLeaves(cx,cy,amp);bump(cx,cy,-amp*waveK)}
function step(){
  for(let y=1;y<gh-1;y++){let i=y*gw+1;
    for(let x=1;x<gw-1;x++,i++)B[i]=((A[i-1]+A[i+1]+A[i-gw]+A[i+gw])*.5-B[i])*D[i];}
  const t=A;A=B;B=t;
}
function upload(){
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const i=y*gw+x,k=i*4;
    let dx=0,dy=0;
    if(x>0&&y>0&&x<gw-1&&y<gh-1){dx=A[i+1]-A[i-1];dy=A[i+gw]-A[i-gw];}
    bytes[k]=Math.max(0,Math.min(255,128+dx*2));
    bytes[k+1]=Math.max(0,Math.min(255,128+dy*2));
    bytes[k+2]=128;bytes[k+3]=255;
  }
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gw,gh,0,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
}

// ---- floating leaves: mass, drag, streamlining, wakes ----
const leaves=[];
{const asp0=innerWidth/innerHeight;
  for(let k=0;k<4;k++){let x,y,tries=0,ok;

  if(dt>.04)slow++;else slow=Math.max(0,slow-1);
  if(adaptive&&slow>45&&renderScale>.55){renderScale*=.8;slow=0;if(renderScale<.8)lowShader=1;init()}
  for(let c=0;acc>=1/120&&c<6;c++){step();acc-=1/120;if(++ticks%2===0){stepLeaves();stepFish();stepCritters()}}
  gl.uniform4fv(uLeaf,lbuf);upload();gl.uniform1f(uTime,now/1000);
  lerpMode();stepFlies(now/1000);
  gl.uniform4fv(uFish,fbuf);gl.uniform4fv(uFrog,frogBuf);gl.uniform4fv(uDfly,dfBuf);gl.uniform3fv(uFly,flyBuf);gl.uniform1f(uFt,now/1000);gl.uniform1f(uWind,wind);gl.uniform1f(uLow,lowShader);
  gl.uniform3fv(uSkyH,cur.h);gl.uniform3fv(uSkyZ,cur.z);gl.uniform3fv(uSunC,cur.s);gl.uniform1f(uExp,cur.e);gl.uniform1f(uNight,cur.ni);
  gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(loop);
}
init();
stepLeaves();stepFish();stepCritters();
requestAnimationFrame(loop);
}
